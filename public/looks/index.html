<!doctype html>
<html lang="en" data-pal="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suit Aura Girls: design previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://media.suitauragirls.in">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* Design previews for the owner (not part of the storefront). Every option is drawn in two colours on white. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#0E4A36;--c1s:#1C5E48;--c2:#E9B23A;--c2t:#7D5200;--t1:#E8F2ED;--t2:#FFF3D2;--ink:#10231C;--mut:#55635D;--line:#DCE5E0;--page:#FBFBF8;--ond:#CDE2D9}
[data-pal=wine]{--c1:#6B1535;--c1s:#832447;--c2:#E9B23A;--c2t:#7D5200;--t1:#F7ECEF;--t2:#FFF3D2;--ink:#2A0F19;--mut:#6A5560;--line:#EADFE3;--page:#FDFBFA;--ond:#EBCFD8}
[data-pal=black]{--c1:#0A0A0A;--c1s:#1F1F1F;--c2:#F5A300;--c2t:#8A5200;--t1:#F2F2F2;--t2:#FFEFC9;--ink:#0A0A0A;--mut:#555555;--line:#E3E3E3;--page:#FAFAFA;--ond:#BDBDBD}
html,body{overflow-x:clip}
body{font-family:Figtree,system-ui,sans-serif;background:#E9E9E6;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4;padding-bottom:86px}
svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
svg.fl{fill:currentColor;stroke:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
s{text-decoration:line-through}

/* Page chrome */
.top{position:sticky;top:0;z-index:30;background:#111;color:#fff;padding:9px 12px 0}
.intro{background:#111;color:#fff;padding:12px 14px 4px;text-align:center}
.intro h1{font-size:15px;font-weight:700}
.intro p{font-size:12.5px;color:#C9C9C9;margin-top:3px}
.pals{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pals::-webkit-scrollbar{display:none}
@media(min-width:520px){.pals{justify-content:center}}
.pals button{flex:none;white-space:nowrap;height:34px;border-radius:99px;padding:0 12px 0 6px;background:#262626;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.pals button[aria-pressed=true]{background:#fff;color:#111}
.pals i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;height:30px;border-radius:99px;padding:0 11px;background:#262626;color:#fff;font-size:12px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:5px}
.jump a.done{background:#fff;color:#111}
.wrap{max-width:1240px;margin:0 auto;padding:0 10px}
.sec{padding-top:26px;scroll-margin-top:96px}
.sec>h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;margin:0 2px 12px}
.sec>h2 b{display:grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:15px}
.opts{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.opts{grid-template-columns:repeat(3,1fr);align-items:start}}
.opt{max-width:400px;width:100%;margin:0 auto}
.oh{display:flex;align-items:center;gap:8px;margin:0 2px 7px}
.oh b{font-size:14px;font-weight:800;background:#fff;border-radius:8px;padding:3px 8px}
.oh span{font-size:12.5px;color:#444;flex:1;min-width:0;line-height:1.3}
.pick{height:34px;border-radius:99px;padding:0 13px;background:#fff;font-size:12.5px;font-weight:700;border:1.5px solid #111;white-space:nowrap}
.opt.sel .pick{background:#111;color:#fff}
.opt.sel .frame{outline:3px solid #111;outline-offset:2px}
.frame{background:var(--page);border-radius:24px;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.14);color:var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#111;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.tray div{flex:1;min-width:0;font-size:12.5px;line-height:1.35}
.tray div b{display:block;font-size:13px}
.tray div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#C9C9C9}
.tray button{height:42px;border-radius:99px;padding:0 16px;background:#fff;color:#111;font-weight:800;font-size:13px;flex:none}

/* Building blocks used inside the mockups */
.r{display:flex;align-items:center;gap:8px}
.rt2{display:flex;align-items:flex-start;gap:10px}
.c{display:flex;flex-direction:column;gap:8px}
.f1{flex:1;min-width:0}
.sb{justify-content:space-between}
.ctr{text-align:center;align-items:center;justify-content:center}
.pd{padding:12px}.pd16{padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sx{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.sx::-webkit-scrollbar{display:none}
.sx>*{flex:none}
.h{font-family:Fraunces,serif;font-weight:700;font-size:20px;line-height:1.2}
.t{font-weight:700;font-size:14px;line-height:1.3}
.m{color:var(--mut);font-size:12.5px;line-height:1.4}
.x{font-size:11px}
.ey{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c2t)}
.sv{color:var(--c2t);font-weight:700}
.lk{color:var(--c1);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.ln{border:1px solid var(--line)}
.t1{background:var(--t1)}.t2{background:var(--t2)}.wh{background:#fff}
.dk{background:var(--c1);color:#fff}
.dk .m{color:var(--ond)}
.dk .ey{color:var(--c2)}
.bk{border-radius:22px;padding:14px}
.cir{border-radius:50%;display:grid;place-items:center;flex:none}
.bt{height:44px;border-radius:99px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;white-space:nowrap}
.bt.s{height:36px;font-size:12.5px;padding:0 13px}
.b1{background:var(--c1);color:#fff}
.b2{background:var(--c2);color:var(--ink)}
.b3{background:#fff;color:var(--c1);box-shadow:inset 0 0 0 1.5px var(--c1)}
.dk .b3{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.w{width:100%}
.chip{height:34px;border-radius:99px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;white-space:nowrap;flex:none}
.chip.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.chip.ac{background:var(--c2);border-color:var(--c2);color:var(--ink)}
.rt{background:var(--c1);color:#fff;border-radius:7px;padding:2px 6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.rt i{font-style:normal;font-weight:500;opacity:.8}
.prc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.prc b{font-size:16px;font-weight:800}
.prc.big b{font-size:23px}
.prc s{color:var(--mut);font-size:12.5px}
.prc em{font-style:normal;color:var(--c2t);font-weight:700;font-size:12.5px}
.dk .prc s{color:var(--ond)}.dk .prc em{color:var(--c2)}
.bd{display:inline-block;font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;background:var(--t2);color:var(--c2t);white-space:nowrap}
.ph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;background:var(--t1)}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600;line-height:1.3}
.in{height:46px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:0 16px;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px}
.in.sq{border-radius:14px}
.hr{height:1px;background:var(--line)}
.dash{border-top:2px dashed var(--line)}
.logo{border-radius:50%;background:#fff;flex:none}
.br{font-weight:900;letter-spacing:.07em;font-size:15px;line-height:1.1;white-space:nowrap}
.br b{color:var(--c2t)}
.dk .br b{color:var(--c2)}
.dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--c2);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.ring{position:relative}
.ring::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c2);border-right-color:var(--c2);animation:spin 5s linear infinite}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c1);border-radius:9px}
.nav{display:flex;justify-content:space-around;align-items:center}
.nav span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:14px}
.note{font-size:11.5px;color:#666;margin:6px 4px 0;line-height:1.4}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="intro">
  <h1>Suit Aura Girls: har section ke 3 design</h1>
  <p>Upar se colour badlo. Jo design pasand aaye us pe "Ye wala" dabao, phir niche "Copy" karke mujhe bhej do.</p>
</div>
<div class="top">
  <div class="pals" id="pals"></div>
  <nav class="jump" id="jump"></nav>
</div>
<main class="wrap" id="main"></main>
<div class="tray"><div><b id="count">0 chune</b><span id="picks">Abhi kuch nahi chuna</span></div><button id="copy">Copy</button></div>
<script src="looks.js"></script>
<script src="looks-a.js"></script>
<script src="looks-b.js"></script>
</body>
</html>
