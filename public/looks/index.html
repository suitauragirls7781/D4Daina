<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suit Aura Girls: festive, header, deal and hero previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://media.suitauragirls.in">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Design previews for the owner (not part of the storefront). Noir & Champagne. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#161514;--mut:#6B6762;--line:#E4E0DA;--alt:#F6F4F0;--ch:#A6824A;--cht:#8A6A36;--chl:#C9A66B}
body{font-family:Figtree,system-ui,sans-serif;background:#DEDCD8;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;padding-bottom:90px}
img{display:block;max-width:100%}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
s{text-decoration:line-through}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.intro{background:#111;color:#fff;text-align:center;padding:14px}
.intro h1{font-size:15px;font-weight:600}.intro p{font-size:12.5px;color:#C9C9C9;margin-top:3px}
.wrap{max-width:1260px;margin:0 auto;padding:0 10px}
.sec{padding-top:28px}
.sec>h2{font-size:19px;font-weight:700;display:flex;gap:9px;align-items:center;margin:0 2px 12px}
.sec>h2 b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:15px}
.opts{display:grid;gap:20px}
@media(min-width:960px){.opts{grid-template-columns:repeat(3,1fr);align-items:start}}
.opt{max-width:400px;width:100%;margin:0 auto}
.oh{display:flex;align-items:center;gap:8px;margin:0 2px 7px}
.oh b{font-size:14px;font-weight:700;background:#fff;padding:3px 8px}
.oh span{flex:1;font-size:12.5px;color:#444;line-height:1.3}
.pick{height:34px;padding:0 13px;border:1.5px solid #111;background:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.opt.sel .pick{background:#111;color:#fff}
.opt.sel .frame{outline:3px solid #111;outline-offset:2px}
.frame{background:#fff;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.16)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#111;color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center}
.tray div{flex:1;min-width:0;font-size:12.5px}.tray b{display:block;font-size:13px}.tray span{display:block;color:#C9C9C9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray button{height:42px;padding:0 16px;background:#fff;color:#111;font-weight:700;font-size:13px}

.r{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.f1{flex:1;min-width:0}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cht)}
.h{font-family:Fraunces,serif;font-weight:500;font-size:24px;line-height:1.16}
.m{color:var(--mut);font-size:13px}
.bt{height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.b1{background:var(--ink);color:#fff}.b2{border:1px solid var(--ink)}.bw{background:#fff;color:var(--ink)}.bg{border:1px solid var(--chl);color:var(--chl)}
.dk{background:var(--ink);color:#fff}.dk .lab{color:var(--chl)}.dk .m{color:#B9B4AC}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pr b{font-size:22px;font-weight:600}.pr s{color:var(--mut);font-size:13px}.pr em{font-style:normal;color:var(--cht);font-weight:600;font-size:13px}
.dk .pr s{color:#B9B4AC}.dk .pr em{color:var(--chl)}
.ph{width:100%;object-fit:cover;object-position:top;background:var(--alt)}
.cd{display:flex;gap:7px}
.cd span{min-width:52px;padding:8px 4px 6px;text-align:center;border:1px solid rgba(201,166,107,.55);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#B9B4AC}
.cd b{display:block;font-size:20px;font-weight:600;color:#fff;letter-spacing:0;font-variant-numeric:tabular-nums}
.cd.lt span{border-color:var(--line);color:var(--mut)}.cd.lt b{color:var(--ink)}
.wm{font-family:Fraunces,serif;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:18px;white-space:nowrap}
.ann{background:var(--ink);color:#fff;text-align:center;font-size:11.5px;letter-spacing:.05em;padding:8px}
.page{height:120px;background:repeating-linear-gradient(180deg,#fff 0 30px,#FAF8F5 30px 60px)}
.credit{font-size:10.5px;color:#777;margin:6px 4px 0;line-height:1.4}
.kb{animation:kb 9s ease-out both;transform-origin:50% 35%}@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.glow{animation:glow 3.2s ease-in-out infinite}@keyframes glow{50%{filter:brightness(1.16)}}
.bar{height:2px;background:rgba(255,255,255,.25)}.bar i{display:block;height:100%;background:var(--chl);transform-origin:left;animation:fill 6s linear infinite}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="intro"><h1>4 hisse, har ek ke 3 design</h1><p>Jo pasand aaye us pe "Ye wala" dabao, phir niche "Copy" karke mujhe bhej do. Ghadi asli hai (20 Oct tak).</p></div>
<main class="wrap" id="main"></main>
<div class="tray"><div><b id="count">0 / 4 chune</b><span id="picks">Abhi kuch nahi chuna</span></div><button id="copy">Copy</button></div>
<script>
const M='https://media.suitauragirls.in/i/product-images/';const img=(id,w=640)=>`${M}${id}/w${w}.webp`;
const A='hq2aynnnjhesnmk5hzwl',B='ccpc3qzsafzwwbffrreb',C='tfqqvjciw7oivdtfmzwx',D='nmnzuj6tr9fy2qaooppg';
const rs=n=>'₹'+n.toLocaleString('en-IN');
const P={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',copy:'<rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}">${P[n]}</svg>`;
const cd=(lt)=>`<div class="cd${lt?' lt':''}" data-cd><span><b data-d>--</b>Days</span><span><b data-h>--</b>Hours</span><span><b data-m>--</b>Min</span><span><b data-s>--</b>Sec</span></div>`;
const offer=`<div class="lab">Festive month</div><div class="h" style="margin-top:6px">Dussehra Dhamaka</div><div style="font-size:16px;margin-top:8px">Extra 10% off with code <b style="font-weight:600;color:var(--chl)">DUSSEHRA</b></div><div class="m" style="margin-top:4px">Up to ${rs(400)} on orders above ${rs(499)} · Plus 15% off when you pay online</div>`;
const btns=`<div class="r" style="margin-top:16px"><span class="bt bw f1">Shop the sale</span><span class="bt bg f1">${ic('copy',16)}DUSSEHRA</span></div>`;

const S=[
{t:'Dussehra banner (asli tasveer ke saath)',o:[
['Asli photo: Ravan Dahan ki raat, aag ki roshni me offer aur chalti ghadi',`
  <div class="dk" style="position:relative;overflow:hidden"><img class="ph kb glow" src="img/dahan.webp" style="height:270px;object-position:center" alt="">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,21,20,.05) 0%,rgba(22,21,20,.82) 52%,#161514 74%)"></div>
  <div class="rise" style="position:relative;margin-top:-64px;padding:0 18px 20px">${offer}<div class="lab" style="margin-top:14px;margin-bottom:8px">Offer ends 20 Oct</div>${cd()}${btns}</div></div>
  <p class="credit">Photo: "Ravan Dahan" by Hetavee, Wikimedia Commons, CC0 (muft, kisi bhi kaam ke liye).</p>`],
['Paramparik painting: Shri Ram rath se das sir wale Ravan pe teer chalate hue (17vi sadi, Mewar Ramayan)',`
  <div class="dk" style="padding:14px"><div style="border:1px solid rgba(201,166,107,.6);padding:5px"><div style="overflow:hidden"><img class="ph kb" src="img/mewar.webp" style="aspect-ratio:890/496" alt=""></div></div>
  <div class="m" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;text-align:center">Rama slays Ravana · Mewar Ramayana, 17th century</div>
  <div class="rise" style="padding:16px 4px 6px">${offer}<div class="lab" style="margin-top:14px;margin-bottom:8px">Offer ends 20 Oct</div>${cd()}${btns}</div></div>
  <p class="credit">Painting: Mewar Ramayana (British Library), public domain.</p>`],
['Halka panel: sunehre rath pe Shri Ram (1916 ki painting), neeche safed pe offer',`
  <div><div style="overflow:hidden"><img class="ph kb" src="img/chariot.webp" style="aspect-ratio:1000/520" alt=""></div>
  <div class="rise" style="padding:18px 18px 20px;border:1px solid var(--line);border-top:0"><div class="lab">Festive month · Vijayadashami</div><div class="h" style="margin-top:6px">Dussehra Dhamaka</div><div class="h" style="font-size:15px;font-style:italic;font-weight:400;color:var(--mut);margin-top:4px">The victory of good over evil</div><div style="font-size:16px;margin-top:10px">Extra 10% off with code <b style="font-weight:600">DUSSEHRA</b></div><div class="m" style="margin-top:4px">Up to ${rs(400)} on orders above ${rs(499)} · Plus 15% off when you pay online</div><div class="lab" style="margin-top:14px;margin-bottom:8px">Offer ends 20 Oct</div>${cd(1)}<div class="r" style="margin-top:16px"><span class="bt b1 f1">Shop the sale</span><span class="bt b2 f1">${ic('copy',16)}DUSSEHRA</span></div></div></div>
  <p class="credit">Painting: Balasaheb Pant Pratinidhi, 1916, public domain.</p>`],
]},
{t:'Header',o:[
['Safed, beech me naam (abhi wala), upar offer ki patti',`
  <div class="ann">Dussehra Dhamaka · Extra 10% off with code DUSSEHRA</div>
  <div class="r sb" style="padding:14px 16px;border-bottom:1px solid var(--line)">${ic('menu',22)}<span class="wm">Suit Aura Girls</span><span class="r" style="gap:14px">${ic('search',21)}${ic('bag',21)}</span></div><div class="page"></div>`],
['Kaala header: sunehra naam, niche collection ki line (Suits · Co-ords · Dresses …)',`
  <div class="dk"><div class="r sb" style="padding:14px 16px">${ic('menu',22)}<span class="wm" style="color:var(--chl)">Suit Aura Girls</span><span class="r" style="gap:14px">${ic('search',21)}${ic('bag',21)}</span></div>
  <div class="r" style="gap:20px;padding:0 16px 12px;overflow:hidden;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap"><span style="border-bottom:1px solid var(--chl);padding-bottom:3px">New in</span><span class="m">Suits</span><span class="m">Co-ords</span><span class="m">Dresses</span><span class="m">Offers</span></div></div>
  <div style="text-align:center;font-size:11.5px;letter-spacing:.05em;padding:8px;background:var(--alt);color:var(--cht);font-weight:600">Extra 10% off with code DUSSEHRA · Till 20 Oct</div><div class="page"></div>`],
['Safed, logo aur naam left me, niche search ka dibba hamesha khula',`
  <div class="r sb" style="padding:12px 16px 10px"><span class="r" style="gap:10px"><img src="/suit-aura-mark-132.webp" width="36" height="36" style="border-radius:50%;border:1px solid var(--line)" alt=""><span><span class="wm" style="font-size:16px;display:block">Suit Aura Girls</span><span class="m" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase">Ethnic wear · Delivery across India</span></span></span><span class="r" style="gap:14px">${ic('heart',21)}${ic('bag',21)}</span></div>
  <div style="padding:0 16px 12px;border-bottom:1px solid var(--line)"><div class="r" style="height:44px;border:1px solid var(--line);padding:0 12px;color:var(--mut)">${ic('search',18)}Search suits, dresses…</div></div>
  <div class="ann" style="background:var(--alt);color:var(--cht);font-weight:600">Extra 10% off with code DUSSEHRA · Till 20 Oct</div><div class="page"></div>`],
]},
{t:'Deal of the day',o:[
['Kaala panel, sone ki border, daam bada (abhi wala, ghadi ke saath)',`
  <div style="padding:14px"><div class="dk" style="padding:6px"><div style="border:1px solid rgba(201,166,107,.6);padding:14px"><div class="r" style="align-items:stretch;gap:14px"><div style="width:42%;overflow:hidden"><img class="ph kb" src="${img(A,480)}" style="height:100%;aspect-ratio:4/5" alt=""></div><div class="f1" style="display:grid;gap:7px;align-content:center"><div class="r" style="gap:8px"><span class="lab" style="border:1px solid var(--chl);padding:2px 6px">Deal</span><span class="lab">of the day</span></div><div style="font-size:13.5px;line-height:1.35">Embroidered cold shoulder kurta with white palazzo</div><div class="pr"><b>${rs(550)}</b><s>${rs(999)}</s><em>45% off</em></div><div style="font-size:12.5px;color:var(--chl);font-weight:600">You save ${rs(449)}</div></div></div><span class="bt bg" style="margin-top:14px">View deal ${ic('arr',16)}</span></div></div></div>`],
['Badi photo upar, niche safed pe bahut bada daam aur sone ki patli line',`
  <div><div style="overflow:hidden;position:relative"><img class="ph kb" src="${img(A,828)}" style="aspect-ratio:5/4" alt=""></div>
  <div style="padding:18px;text-align:center"><div class="r" style="justify-content:center;gap:10px"><span style="width:28px;height:1px;background:var(--ch)"></span><span class="lab">Deal of the day</span><span style="width:28px;height:1px;background:var(--ch)"></span></div><div class="h" style="font-size:20px;margin-top:10px">Embroidered cold shoulder kurta with white palazzo</div><div style="margin-top:12px;font-family:Fraunces,serif;font-size:44px;font-weight:500;line-height:1">${rs(550)}</div><div class="m" style="margin-top:6px"><s>${rs(999)}</s> · <b style="color:var(--cht);font-weight:600">45% off · You save ${rs(449)}</b></div><span class="bt b1" style="margin-top:16px">Grab the deal ${ic('arr',16)}</span></div></div>`],
['Do hisson wala card: left kaala "45% OFF" bada, right photo aur daam',`
  <div style="padding:14px"><div class="r" style="align-items:stretch;gap:0;border:1px solid var(--ink)"><div class="dk" style="width:38%;padding:16px 12px;display:grid;align-content:center;gap:6px;text-align:center"><span class="lab">Deal of the day</span><span style="font-family:Fraunces,serif;font-size:46px;line-height:.95;color:var(--chl)">45<span style="font-size:22px">%</span></span><span style="font-size:11px;letter-spacing:.2em;text-transform:uppercase">off today</span></div><div class="f1" style="padding:12px;display:grid;gap:8px"><div class="r" style="gap:10px;align-items:flex-start"><div style="width:74px;overflow:hidden"><img class="ph" src="${img(A,320)}" style="aspect-ratio:4/5" alt=""></div><div class="f1"><div style="font-size:13px;line-height:1.35">Embroidered cold shoulder kurta with white palazzo</div><div class="pr" style="margin-top:6px"><b style="font-size:19px">${rs(550)}</b><s>${rs(999)}</s></div></div></div><span class="bt b1" style="height:40px">View deal</span></div></div></div>`],
]},
{t:'Hero banner',o:[
['Badi photo, niche safed pe naam aur daam (abhi wala, dheere zoom ke saath)',`
  <div><div style="overflow:hidden"><img class="ph kb" src="${img(A,828)}" style="aspect-ratio:1/1" alt=""></div><div class="r" style="gap:6px;padding:10px 16px 0"><span class="f1" style="height:1px;background:var(--ink)"></span><span class="f1" style="height:1px;background:var(--line)"></span><span class="f1" style="height:1px;background:var(--line)"></span><span class="m" style="font-size:11px">01 / 03</span></div>
  <div class="rise" style="padding:20px 18px 22px;text-align:center"><div class="lab">New season</div><div class="h" style="margin-top:8px">Embroidered cold shoulder kurta with white palazzo</div><div class="pr" style="justify-content:center;margin-top:10px"><b>${rs(550)}</b><s>${rs(999)}</s><em>45% off</em></div><div class="r" style="margin-top:16px"><span class="bt b1 f1">Shop now</span><span class="bt b2 f1">Explore</span></div></div></div>`],
['Magazine jaisa: do photo upar-niche khiski hui, side me khadi likhai, bada serif naam',`
  <div style="padding:18px 16px 22px"><div class="r" style="align-items:flex-start;gap:12px"><span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--cht);padding-top:4px">Festive edit · 2026</span><div class="f1" style="position:relative;padding-bottom:70px"><div style="width:78%;overflow:hidden"><img class="ph kb" src="${img(B,640)}" style="aspect-ratio:4/5" alt=""></div><div style="width:46%;position:absolute;right:0;bottom:0;border:6px solid #fff;overflow:hidden"><img class="ph" src="${img(C,480)}" style="aspect-ratio:4/5" alt=""></div></div></div>
  <div class="rise" style="margin-top:16px"><div class="h" style="font-size:30px">The festive<br><i style="font-weight:400">edit</i></div><div class="m" style="margin-top:8px">Kurta sets from ${rs(550)}. Extra 10% with code DUSSEHRA.</div><div class="r" style="margin-top:16px"><span class="bt b1">Shop the edit ${ic('arr',16)}</span></div></div></div>`],
['Kaala, shaahi: sone ke frame me photo, safed serif naam, sunehra daam',`
  <div class="dk" style="padding:16px 16px 22px"><div class="r sb"><span class="lab">New season</span><span class="m" style="font-size:11px;letter-spacing:.1em">01 / 03</span></div>
  <div style="border:1px solid rgba(201,166,107,.6);padding:6px;margin-top:12px"><div style="overflow:hidden"><img class="ph kb" src="${img(D,828)}" style="aspect-ratio:4/5" alt=""></div></div>
  <div class="rise" style="margin-top:16px;text-align:center"><div class="h">Royal blue crop top, skirt and floral jacket</div><div class="pr" style="justify-content:center;margin-top:10px"><b>${rs(1299)}</b><s>${rs(1899)}</s><em>32% off</em></div><div class="r" style="margin-top:16px"><span class="bt bw f1">Shop now</span><span class="bt bg f1">Explore</span></div><div class="bar" style="margin-top:18px"><i></i></div></div></div>`],
]},
];
let picks={};try{picks=JSON.parse(localStorage.getItem('sag-looks4')||'{}')||{}}catch{}
const show=()=>{const done=Object.keys(picks).map(Number).sort((a,b)=>a-b);document.querySelectorAll('.opt').forEach(el=>el.classList.toggle('sel',picks[el.dataset.s]===el.dataset.o));document.querySelectorAll('.pick').forEach(el=>{const o=el.closest('.opt');el.textContent=picks[o.dataset.s]===o.dataset.o?'✓ Chuna':'Ye wala'});document.getElementById('count').textContent=`${done.length} / ${S.length} chune`;document.getElementById('picks').textContent=done.length?done.map(s=>`${s}-${picks[s]}`).join(', '):'Abhi kuch nahi chuna'};
document.getElementById('main').innerHTML=S.map((s,n)=>`<section class="sec"><h2><b>${n+1}</b>${s.t}</h2><div class="opts">${s.o.map(([d,h],k)=>`<div class="opt" data-s="${n+1}" data-o="${k+1}"><div class="oh"><b>${n+1}-${k+1}</b><span>${d}</span><button class="pick">Ye wala</button></div><div class="frame">${h}</div></div>`).join('')}</div></section>`).join('');
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b)return;const o=b.closest('.opt');if(picks[o.dataset.s]===o.dataset.o)delete picks[o.dataset.s];else picks[o.dataset.s]=o.dataset.o;try{localStorage.setItem('sag-looks4',JSON.stringify(picks))}catch{}show()});
document.getElementById('copy').addEventListener('click',async e=>{const t=Object.keys(picks).map(Number).sort((a,b)=>a-b).map(s=>`${s}-${picks[s]} (${S[s-1].t})`).join('\n');try{await navigator.clipboard.writeText(t);e.target.textContent='Copy ho gaya'}catch{prompt('Ye copy karke bhej do',t)}setTimeout(()=>e.target.textContent='Copy',1800)});
// The real end of the Dussehra round: 20 Oct 2026, end of day in India
const END=Date.parse('2026-10-20T23:59:59+05:30');const two=n=>String(Math.max(0,n)).padStart(2,'0');
const tick=()=>{const left=Math.max(0,END-Date.now()),d=Math.floor(left/864e5),h=Math.floor(left/36e5)%24,m=Math.floor(left/6e4)%60,s=Math.floor(left/1e3)%60;document.querySelectorAll('[data-cd]').forEach(el=>{el.querySelector('[data-d]').textContent=two(d);el.querySelector('[data-h]').textContent=two(h);el.querySelector('[data-m]').textContent=two(m);el.querySelector('[data-s]').textContent=two(s)})};
tick();setInterval(tick,1000);show();
</script>
</body>
</html>
