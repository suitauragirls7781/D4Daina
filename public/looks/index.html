<!doctype html>
<html lang="en" data-look="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Suit Aura Girls: 2 premium looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://media.suitauragirls.in">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Design previews for the owner (not part of the storefront): two calm, premium looks.
   Fewer colours, thin lines, small corners, more white space; no coloured blocks, rings or bouncing parts. */
*{box-sizing:border-box;margin:0;padding:0}
/* Look 1: Noir & Champagne. White, near-black, a little champagne gold. Sharp corners, small capital labels. */
:root{--bg:#FFFFFF;--card:#FFFFFF;--alt:#F6F4F0;--ink:#161514;--mut:#6B6762;--line:#E4E0DA;--pri:#161514;--on:#FFFFFF;--acc:#8A6A36;--accbg:#A6824A;--foot:#161514;--r:0px;--rb:0px;--case:uppercase;--ls:.12em;--bfs:12.5px;--hw:500}
/* Look 2: Rosewood & Ivory. Warm ivory, deep rosewood, antique gold. Soft small corners, classic serif. */
[data-look=rose]{--bg:#FBF7F1;--card:#FFFFFF;--alt:#F3E8E4;--ink:#2A1A1E;--mut:#75646A;--line:#E8DCD5;--pri:#6A1B33;--on:#FFFFFF;--acc:#9A7434;--accbg:#B08A47;--foot:#3A1420;--r:10px;--rb:8px;--case:none;--ls:.01em;--bfs:14.5px;--hw:600}
body{font-family:Figtree,system-ui,sans-serif;background:#DEDCD8;color:#111;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;padding-bottom:40px}
img{display:block;max-width:100%}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
svg.fl{fill:currentColor;stroke:none}
s{text-decoration:line-through}

.top{position:sticky;top:0;min-height:58px;z-index:30;background:#111;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.top b{font-size:13px;font-weight:600;margin-right:4px}
.top button{font:inherit;border:0;cursor:pointer;height:38px;border-radius:99px;padding:0 14px 0 8px;background:#2a2a2a;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.top button[aria-pressed=true]{background:#fff;color:#111}
.top i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.intro{max-width:760px;margin:18px auto 0;padding:0 14px;text-align:center}
.intro h1{font-family:Fraunces,serif;font-weight:500;font-size:24px}
.intro p{font-size:13.5px;color:#444;margin-top:6px}
.screens{display:grid;gap:26px;grid-template-columns:1fr;max-width:1300px;margin:22px auto 0;padding:0 12px}
@media(min-width:1000px){.screens{grid-template-columns:repeat(3,1fr);align-items:start}}
.scr{max-width:400px;width:100%;margin:0 auto}
.scr>h2{font-size:14px;font-weight:700;margin:0 4px 8px}
.frame{background:var(--bg);color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* Pieces */
.r{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.f1{flex:1;min-width:0}
.pd{padding:0 16px}
.sec{padding:26px 16px}
.hl{border-top:1px solid var(--line)}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.h{font-family:Fraunces,serif;font-weight:var(--hw);font-size:23px;line-height:1.18;letter-spacing:-.005em}
.h.sm{font-size:19px}
.m{color:var(--mut);font-size:13px}
.x{font-size:11.5px}
.lk{font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.bt{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;border-radius:var(--rb);font-weight:600;font-size:var(--bfs);letter-spacing:var(--ls);text-transform:var(--case);white-space:nowrap}
.b1{background:var(--pri);color:var(--on)}
.b2{border:1px solid var(--ink);color:var(--ink);background:transparent}
.b3{background:var(--accbg);color:#fff}
.w{width:100%}
.ph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;background:var(--alt);border-radius:var(--r)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sx{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.sx::-webkit-scrollbar{display:none}
.sx>*{flex:none}
.nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pr b{font-size:14.5px;font-weight:600}
.pr.big b{font-size:22px}
.pr s{color:var(--mut);font-size:12.5px}
.pr em{font-style:normal;color:var(--acc);font-size:12.5px;font-weight:600}
.rt{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:4px}
.rt svg{color:var(--accbg)}
.ann{background:var(--pri);color:var(--on);text-align:center;font-size:11.5px;letter-spacing:.06em;padding:8px 10px}
.wm{font-family:Fraunces,serif;font-weight:500;font-size:18px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
[data-look=rose] .wm{letter-spacing:.04em;text-transform:none;font-size:21px;font-weight:600}
.fld{height:46px;border:1px solid var(--line);border-radius:var(--rb);background:var(--card);display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--mut);font-size:14px}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.chip{height:38px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--rb);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--card)}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.foot{background:var(--foot);color:#fff;padding:26px 16px 22px}
.foot .m{color:rgba(255,255,255,.66)}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--card);padding:9px 4px 11px}
.nav span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);letter-spacing:.03em}
.nav span.on{color:var(--ink);font-weight:600}
.dot{position:absolute;top:-5px;right:-7px;min-width:15px;height:15px;border-radius:8px;background:var(--pri);color:var(--on);font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.note{max-width:760px;margin:26px auto 0;padding:0 14px;font-size:13px;color:#333;line-height:1.6}
.note b{font-weight:700}
</style>
</head>
<body>
<div class="top"><b>Look chuno:</b><span id="looks" style="display:contents"></span></div>
<div class="intro">
  <h1 id="lookName"></h1>
  <p id="lookText"></p>
</div>
<main class="screens" id="main"></main>
<p class="note">Dono look me <b>layout ek jaisa</b> hai, taaki aap sirf rang aur andaaz ki tulna kar sako. Products, daam, rating, review, coupon aur store ki 4 baatein asli hain. Jo look pasand aaye uska naam bata do (ya "1" / "2"), phir main poori site usi me badal dunga.</p>
<script src="looks.js"></script>
<script src="looks-more.js"></script>
</body>
</html>
