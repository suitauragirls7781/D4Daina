<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Product card: 5 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/looks/looks.css">
<style>
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.pc{position:relative;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:4/5;overflow:hidden;background:var(--sunken)}
.pc .ph img{width:100%;height:100%}
.heart{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(34,27,51,.16);color:var(--pink)}
.heart svg{width:17px;height:17px}
.nm{font-size:13px;font-weight:600;line-height:1.3;min-height:34px}
.add{height:40px;border-radius:99px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.add svg{width:16px;height:16px}
.plus{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.list{display:flex;flex-direction:column;gap:10px;padding:14px}
.lc{display:grid;grid-template-columns:42% 1fr;gap:12px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(34,27,51,.07);position:relative}
.lc .ph{aspect-ratio:4/5;background:var(--sunken)}
.lc .ph img{width:100%;height:100%}
</style>
</head>
<body>
<script src="/looks/kit.js"></script>
<script>
// Two real styles with their real ratings
const A = { name: P1.name, price: P1.price, mrp: P1.mrp, off: P1.off, rating: '4.7', n: 9, photo: P1.photos[0], tag: 'NEW' };
const B = { name: P3.name, price: P3.price, mrp: P3.mrp, off: P3.off, rating: '4.8', n: 4, photo: P3.photo, tag: 'NEW' };
const two = (fn) => `<div class="grid2">${[A, B].map(fn).join('')}</div>`;
const price = (x, size = 17) => `<span class="num"><span class="xb" style="font-size:${size}px">${rs(x.price)}</span> <span class="strike t12">${rs(x.mrp)}</span> <span class="salec xb t12">${x.off}% off</span></span>`;
const rate = (x) => `<span class="rate">${x.rating} ★</span> <span class="t12 muted num">(${x.n})</span>`;
const heart = `<span class="heart">${I.heart}</span>`;
const title = '<div class="serif t20" style="padding:14px 14px 0">New arrivals</div>';

render('Product card', [
  ['White card', 'Abhi jaisa: safed gol card halki chhaya ke saath, photo par dil, neeche badge, naam, hara rating pill, daam aur violet kinari wala "Add to bag".',
    `${title}${two((x) => `<div class="pc card" style="overflow:hidden"><div class="ph"><img src="${img(x.photo, 400)}" alt=""></div>${heart}<div style="padding:10px"><span class="badge bg-ink white">${x.tag}</span><div class="nm clamp2 mt6">${x.name}</div><div class="mt4">${rate(x)}</div><div class="mt6">${price(x)}</div><div class="add outline mt8">${I.bag}Add to bag</div></div></div>`)}`],
  ['Photo first', 'Koi dabba nahi: sirf gol kone wali badi photo, neeche naam aur daam, aur daam ke bagal me gol "+" button. Sabse saaf, photo sabse badi dikhti hai.',
    `${title}${two((x) => `<div class="pc"><div class="ph" style="border-radius:20px"><img src="${img(x.photo, 400)}" alt=""></div>${heart}<div class="mt8"><div class="row g6"><span class="rate">${x.rating} ★</span><span class="t11 xb" style="color:var(--muted)">${x.tag}</span></div><div class="nm clamp2 mt6">${x.name}</div><div class="row between g6 mt6"><div class="num"><div class="xb t16">${rs(x.price)}</div><div class="t12"><span class="strike">${rs(x.mrp)}</span> <span class="salec xb">${x.off}% off</span></div></div><span class="plus primary">${I.plus}</span></div></div></div>`)}`],
  ['Pastel base', 'Card ka neecha hissa rangeen (har card alag pastel), usme naam, bada daam aur dark gol "Add". Home ke rangeen block se mel khata hai.',
    `${title}${two((x) => `<div class="pc ${x === A ? 'bg-lilac' : 'bg-peach'}" style="border-radius:20px;overflow:hidden"><div class="ph" style="border-radius:20px"><img src="${img(x.photo, 400)}" alt=""></div>${heart}<div style="padding:10px"><div class="row between g6"><span class="badge bg-white">${x.tag}</span><span class="t12 b num">${x.rating} ★ (${x.n})</span></div><div class="nm clamp2 mt6">${x.name}</div><div class="row between g6 mt6"><div class="num"><span class="xb t18">${rs(x.price)}</span> <span class="strike t12">${rs(x.mrp)}</span></div><span class="pill dark" style="height:34px;padding:0 13px;font-size:12.5px">Add</span></div><div class="t12 salec xb mt4">${x.off}% off</div></div></div>`)}`],
  ['Offer tag', 'Bachat sabse pehle: daam ke bagal me hara "% off" pill, neeche "You save" ki line, aur bhara hua violet "Add to bag". Offer se kharidne walon ke liye.',
    `${title}${two((x) => `<div class="pc card" style="overflow:hidden"><div class="ph"><img src="${img(x.photo, 400)}" alt=""></div>${heart}<div style="padding:10px"><div class="nm clamp2">${x.name}</div><div class="row g6 mt6 wrapx"><span class="xb t18 num">${rs(x.price)}</span><span class="pill bg-mint" style="height:22px;padding:0 8px;font-size:11px;color:var(--mint-ink)">${x.off}% off</span></div><div class="t12 muted mt4 num"><span class="strike">${rs(x.mrp)}</span> · You save ${rs(x.mrp - x.price)}</div><div class="mt6">${rate(x)}</div><div class="add primary mt8">${I.bag}Add to bag</div></div></div>`)}`],
  ['List row', 'Ek line me ek product: photo baayein, daayein poora naam (kata nahi), rating, daam aur dono button. Naam lamba ho to bhi poora padha jata hai.',
    `${title}<div class="list">${[A, B].map((x) => `<div class="lc"><div class="ph"><img src="${img(x.photo, 400)}" alt=""></div><div style="padding:12px 12px 12px 0"><div class="row between g6"><span class="badge bg-ink white">${x.tag}</span><span style="color:var(--pink)">${I.heart}</span></div><div class="b t13 mt6" style="line-height:1.3">${x.name}</div><div class="mt6">${rate(x)}</div><div class="mt6">${price(x, 18)}</div><div class="add outline mt8">${I.bag}Add to bag</div></div></div>`).join('')}</div>`],
], 'Rating sirf asli review wale product par dikhti hai; "New / Bestseller" badge photo ke neeche rehta hai kyunki photo par aapka watermark hai.');
</script>
</body>
</html>
