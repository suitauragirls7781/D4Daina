<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Menu: 5 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/looks/looks.css">
<style>
.scene{position:relative;background:rgba(34,27,51,.45);min-height:640px}
.dr{background:var(--page);width:86%;min-height:640px;padding:12px 14px 16px;display:flex;flex-direction:column}
.dr.full{width:100%}
.lk{display:flex;align-items:center;gap:12px;height:48px;font-weight:600;font-size:15px}
.lk .f1{flex:1}
.lk svg:last-child{width:16px;height:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles>div{border-radius:20px;padding:14px 12px;font-weight:800;font-size:14.5px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tiles small{font-weight:600;font-size:12px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{height:36px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.chips small{color:var(--muted);font-weight:600}
.circ{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;text-align:center;font-size:12px;font-weight:700}
.circ img{width:72px;height:72px;border-radius:50%;margin:0 auto 6px}
.dk{background:var(--ink);color:#fff}
.dk .lk{font-family:Fraunces,serif;font-size:22px;font-weight:600;height:52px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--page);border-radius:28px 28px 0 0;padding:10px 14px 18px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
</style>
</head>
<body>
<script src="/looks/kit.js"></script>
<script>
const X = { home: '<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-8z"/></svg>', grid: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>' };
const NAV = [['home', 'Home'], ['grid', 'Shop all'], ['box', 'New arrivals'], ['tag', 'Offers'], ['heart', 'Kids & Toys']];
// Collections and their counts as on the live store today
const COL = [['Suits', 11], ['Co-ord Sets', 4], ['Anarkali', 4], ['Dresses', 2], ['Festive Wear', 2], ['Kurtis', 2]];
const pics = [P1.photos[0], P3.photo, P2.photo, P1.photos[3], P1.photos[4], P1.photos[2]];
const ic = (k) => (X[k] || I[k]);
const head = (dark) => `<div class="row between" style="height:44px"><div class="row g8"><img src="${LOGO}" alt="" style="width:38px;height:38px;border-radius:50%;background:#fff"><span class="xb t15" style="letter-spacing:.04em">SUIT AURA <span style="color:${dark ? 'var(--hl)' : 'var(--brand)'}">GIRLS</span></span></div><span class="ic" style="background:${dark ? '#34313F' : 'var(--sunken)'}">${I.x}</span></div>`;
const search = `<div class="field mt10" style="border-radius:99px;height:46px">${I.search.replace('<svg', '<svg style="margin-right:10px;color:var(--brand)"')}Search styles</div>`;
const links = NAV.map(([k, t], i) => `<div class="lk"${i === 0 ? ' style="color:var(--brand)"' : ''}>${ic(k)}<span class="f1">${t}</span>${I.chev}</div>`).join('');
const colRows = COL.map(([n, c]) => `<div class="lk"><span class="f1">${n}</span><span class="muted t13 num">${c}</span>${I.chev}</div>`).join('');
const signin = (cls = 'primary') => `<span class="pill btn-sm ${cls}" style="height:46px">${I.user}Sign in</span>`;

render('Menu', [
  ['List', 'Abhi jaisa, naye rang me: logo, search, icon wali seedhi list, neeche Collections ginti ke saath. Sabse seedha.',
    `<div class="scene"><div class="dr">${head()}${search}<div class="mt8">${links}</div><div class="hr"></div><div class="t12 muted b mt10">Collections</div>${colRows}<div class="hr"></div><div class="row g8 mt12">${signin()}<span class="pill btn-sm ghost f1" style="height:46px">${I.box}Track order</span></div></div></div>`],
  ['Pastel tiles', 'Upar lilac card "Sign in", phir chaar rangeen tile (Shop all, New arrivals, Offers, Kids & Toys). Collections gol chip ban kar. Home page ke block jaisa hi.',
    `<div class="scene"><div class="dr">${head()}<div class="row g10 p12 bg-lilac mt10" style="border-radius:20px"><span class="ic bg-white" style="color:var(--brand)">${I.user}</span><div class="f1"><div class="xb">Sign in</div><div class="t12" style="color:var(--lilac-ink)">Track orders and returns</div></div>${I.chev}</div>
     <div class="tiles mt10"><div class="bg-peach">Shop all<small>26 styles</small></div><div class="bg-mint">New arrivals<small>Just in</small></div><div class="bg-butter">Offers<small>Styles on sale</small></div><div class="bg-sky">Kids &amp; Toys<small>Little ones</small></div></div>
     <div class="t12 muted b mt14">Collections</div><div class="chips mt8">${COL.map(([n, c]) => `<span>${n} <small class="num">${c}</small></span>`).join('')}</div>
     <span class="f1"></span><div class="row g8 mt14"><span class="pill btn-sm dark f1" style="height:46px">${I.wa}WhatsApp</span><span class="pill btn-sm ghost f1" style="height:46px">${I.box}Track order</span></div></div></div>`],
  ['Photo circles', 'Collections gol photo ban kar dikhte hain (naam neeche), jaise Instagram ke highlights. Photo dekh kar chunna aasaan. Upar chhoti link ki patti.',
    `<div class="scene"><div class="dr full">${head()}${search}<div class="chips mt12"><span style="background:var(--ink);color:#fff;box-shadow:none">Shop all</span><span>New arrivals</span><span style="background:var(--butter);box-shadow:none">Offers</span><span>Kids &amp; Toys</span></div>
     <div class="serif t18 mt16">Shop by collection</div><div class="circ mt12">${COL.map(([n], i) => `<div><img src="${img(pics[i], 200)}" alt="">${n}</div>`).join('')}</div>
     <span class="f1"></span><div class="row g8 mt16">${signin('primary f1')}<span class="pill btn-sm ghost f1" style="height:46px">${I.box}Track order</span></div></div></div>`],
  ['Dark drawer', 'Gehra dark menu, bade serif akshar, chalu page mint me. Sabse alag aur premium; neeche ke navbar aur footer se mel khata hai.',
    `<div class="scene"><div class="dr dk">${head(true)}<div class="mt12">${NAV.map(([, t], i) => `<div class="lk"${i === 0 ? ' style="color:var(--hl)"' : ''}><span class="f1">${t}</span></div>`).join('')}</div>
     <div class="hr mt8" style="background:#3A3350"></div><div class="t12 b mt12" style="color:#B9B3CC">Collections</div><div class="two mt6">${COL.map(([n, c]) => `<div class="row between" style="height:40px;font-weight:600"><span>${n}</span><span class="t12 num" style="color:#B9B3CC">${c}</span></div>`).join('')}</div>
     <span class="f1"></span><div class="row g8 mt14"><span class="pill btn-sm f1" style="height:46px;background:var(--hl);color:var(--ink)">${I.user}Sign in</span><span class="pill btn-sm f1" style="height:46px;box-shadow:inset 0 0 0 1.5px #fff">${I.box}Track order</span></div></div></div>`],
  ['Bottom sheet', 'Menu baayein se nahi, neeche se uthta hai (angoothe ke paas). Upar gol chip me mukhya link, neeche do column me collections. Ek haath se chalana aasaan.',
    `<div class="scene"><div class="sheet"><div class="grab"></div><div class="row between"><div class="serif t20">Menu</div><span class="ic bg-sunken">${I.x}</span></div>
     <div class="chips mt12"><span style="background:var(--ink);color:#fff;box-shadow:none">${X.home.replace('<svg', '<svg style="width:16px;height:16px"')}Home</span><span>Shop all</span><span>New arrivals</span><span style="background:var(--butter);box-shadow:none">Offers</span><span>Kids &amp; Toys</span></div>
     <div class="t12 muted b mt14">Collections</div><div class="two">${COL.map(([n, c]) => `<div class="row between" style="height:44px;font-weight:600;border-bottom:1px solid var(--line)"><span>${n}</span><span class="t12 muted num">${c}</span></div>`).join('')}</div>
     <div class="row g8 mt14">${signin('primary f1')}<span class="pill btn-sm ghost f1" style="height:46px">${I.box}Track order</span></div></div></div>`],
], 'Menu ke link wahi rahenge jo abhi hain; collections aur ginti store se apne aap aati hai.');
</script>
</body>
</html>
