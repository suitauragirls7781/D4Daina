<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My account: 5 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/looks/looks.css">
<style>
.lk{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600;font-size:15px;border-top:1px solid var(--line)}
.lk:first-child{border-top:0}
.lk .f1{flex:1}.lk svg:last-child{width:16px;height:16px;color:var(--muted)}
.lk i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;flex:none}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles>div{border-radius:20px;padding:12px;font-weight:800;font-size:14px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.tiles i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff}
.ord{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.ord img{width:62px;aspect-ratio:4/5;border-radius:12px}
.prog{display:flex;gap:4px;margin-top:8px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--sale)}
.tabs{display:flex;gap:7px;overflow:hidden;padding:0 14px}
.tabs span{flex:none;height:38px;padding:0 15px;border-radius:99px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.tabs .on{background:var(--ink);color:#fff;box-shadow:none}
.band{background:var(--ink);color:#fff;border-radius:0 0 28px 28px;padding:18px 16px 22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:11.5px;font-weight:700}
.stats b{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#fff;color:var(--brand);margin:0 auto 6px;font-size:18px}
</style>
</head>
<body>
<script src="/looks/kit.js"></script>
<script>
const SEC = [['box', 'Orders', 'bg-peach'], ['heart', 'Wishlist', 'bg-lilac'], ['pin', 'Addresses', 'bg-sky'], ['tag', 'Coupons', 'bg-butter'], ['user', 'Profile', 'bg-mint'], ['star', 'Style profile', 'bg-lilac'], ['back', 'Returns', 'bg-peach'], ['chat', 'Help Center', 'bg-mint']];
const hello = (sub = 'your email address') => `<div class="f1"><div class="xb t16">My account</div><div class="t12 muted">${sub}</div></div>`;
const rows = (list, tint) => list.map(([k, t, c]) => `<div class="lk">${tint ? `<i class="${c}">${I[k]}</i>` : I[k]}<span class="f1">${t}</span>${I.chev}</div>`).join('');
const badge = `<span class="badge bg-mint" style="color:var(--mint-ink)">SHIPPED</span>`;
const order = (extra = '') => `<div class="ord"><img src="${img(P1.photos[0], 160)}" alt=""><div><div class="row between g8"><span class="t12 muted num">SAG-261005-XXXXX</span>${badge}</div><div class="b t13 clamp2 mt4">${P1.name}</div><div class="t12 muted mt4 num">Size M · Sky Blue · ${rs(P1.price)}</div>${extra}</div></div>`;
const prog = `<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>`;

render('My account', [
  ['List', 'Abhi jaisa, naye rang me: upar naam aur email, neeche seedhi list (Orders, Wishlist, Addresses…). Sabse saaf.',
    `${miniHeader()}<div class="p14"><div class="card p14 row g12"><span class="av bg-lilac" style="color:var(--brand)">${I.user}</span>${hello()}<span class="b t12 brand" style="text-decoration:underline">Sign out</span></div><div class="card mt12" style="padding:2px 14px">${rows(SEC)}</div></div>`],
  ['Pastel tiles', 'Upar lilac block me namaste aur naya order ek nazar me, neeche aath rangeen tile. Home page ke block jaisa hi lagta hai.',
    `${miniHeader()}<div class="p14"><div class="bg-lilac blk p14"><div class="row g12"><span class="av bg-white" style="color:var(--brand)">${I.user}</span>${hello()}</div><div class="card p12 mt12">${order(prog)}</div></div>
     <div class="tiles mt10">${SEC.map(([k, t, c]) => `<div class="${c}"><i>${I[k]}</i>${t}</div>`).join('')}</div></div>`],
  ['Order first', 'Sabse upar "Your latest order" bada card: kahan tak pahuncha, aur Track ka button. Customer sabse zyada yahi dekhne aati hai. Baaki cheezein neeche chhoti list me.',
    `${miniHeader()}<div class="p14"><div class="serif t22">Your latest order</div><div class="bg-mint blk p14 mt10"><div class="row g8 xb" style="color:var(--mint-ink)">${I.truck}Shipped · on its way to you</div><div class="card p12 mt10">${order(prog)}</div><div class="row g8 mt10"><span class="pill btn-sm dark f1" style="height:44px">Track order</span><span class="pill btn-sm bg-white f1" style="height:44px">View details</span></div></div>
     <div class="card mt12" style="padding:2px 14px">${rows(SEC.filter((s) => s[1] !== 'Style profile'), true)}</div></div>`],
  ['Tabs', 'Upar gol tab ki patti (Orders, Wishlist, Addresses, Coupons…), jo chuno wahi neeche khulta hai. Yahan Orders khula hai: har order ek card, status aur Track ke saath.',
    `${miniHeader()}<div class="row g12 p14">${hello()}<span class="b t12 brand" style="text-decoration:underline">Sign out</span></div><div class="tabs"><span class="on">Orders</span><span>Wishlist</span><span>Addresses</span><span>Coupons</span><span>Profile</span></div>
     <div class="col g10 p14"><div class="card p12">${order(`<div class="row g8 mt8"><span class="pill btn-sm outline" style="height:36px">Track</span><span class="pill btn-sm ghost" style="height:36px">Details</span></div>`)}</div>
     <div class="card p12"><div class="ord"><img src="${img(P2.photo, 160)}" alt=""><div><div class="row between g8"><span class="t12 muted num">SAG-260930-XXXXX</span><span class="badge bg-sunken">DELIVERED</span></div><div class="b t13 clamp2 mt4">${P2.name}</div><div class="t12 muted mt4 num">Size L · Sage Green · ${rs(P2.price)}</div><div class="row g8 mt8"><span class="pill btn-sm ghost" style="height:36px">Return or exchange</span></div></div></div></div></div>`],
  ['Dark band', 'Upar gehra dark band, usme naam aur teen gol ginti (Orders, Wishlist, Coupons). Neeche rangeen icon wali list. Footer aur navbar se mel khata hai.',
    `<div class="band"><div class="row g12"><span class="av" style="background:var(--hl);color:var(--ink)">${I.user}</span><div class="f1"><div class="xb t18">My account</div><div class="t12" style="color:#B9B3CC">your email address</div></div><span class="b t12" style="color:var(--hl);text-decoration:underline">Sign out</span></div>
     <div class="stats mt16"><div><b class="num">2</b>Orders</div><div><b class="num">5</b>Wishlist</div><div><b class="num">1</b>Coupons</div></div></div>
     <div class="p14"><div class="card" style="padding:2px 14px">${rows(SEC, true)}</div></div>`],
], 'Order, order number aur ginti sirf namoone ke liye hain; asli page par customer ka apna data aayega.');
</script>
</body>
</html>
