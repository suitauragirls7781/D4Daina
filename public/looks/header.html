<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Header: 3 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* Design previews for the owner (not part of the storefront). Colours: jet black, amber, white. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0A0A0A;--soft:#1C1C1C;--amber:#F5A300;--amber-d:#9A5B00;--muted:#555;--line:#E3E3E3}
body{font-family:Figtree,system-ui,sans-serif;background:#EDEDED;color:var(--black);-webkit-font-smoothing:antialiased;padding-bottom:70px;font-size:14px}
svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;padding:11px 14px;font-size:13px;line-height:1.4;text-align:center}
.wrap{max-width:420px;margin:0 auto;padding:0 10px}
.opt{margin-top:28px}
.opt>h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 4px 4px}
.opt>h2 b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--black);color:#fff;font-size:15px}
.opt>p{font-size:13px;color:var(--muted);margin:0 4px 10px;line-height:1.45}
.frame{background:#FAFAFA;border-radius:26px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.page{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.page i{display:block;height:74px;border-radius:18px;background:#F2F2F2}
.page i:nth-child(2){background:#FFEFC9}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.dot{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--amber);color:var(--black);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pop 2.6s ease-in-out infinite}
.logo{border-radius:50%;background:#fff;display:block}
.row{display:flex;align-items:center}
.f1{flex:1;min-width:0}
.wave span{display:inline-block;animation:rise .6s both,wave 6s ease-in-out infinite;animation-delay:calc(var(--i)*45ms),calc(var(--i)*90ms + 1.6s)}
.type::after{content:"";display:inline-block;width:1.5px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.search{height:46px;border-radius:99px;display:flex;align-items:center;gap:10px;padding:0 15px;font-size:14.5px;min-width:0;flex:1}
.search svg{width:19px;height:19px}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}
@keyframes wave{0%,7%,100%{transform:none}3.5%{transform:translateY(-4px)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes pop{0%,84%,100%{transform:scale(1)}90%{transform:scale(1.3)}}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(245,163,0,.22)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* 1 White pill on black (as now, without PIN) */
.h1{background:var(--black);padding:10px}
.h1 .pill{background:#fff;border-radius:99px;padding:5px 6px 5px 5px;display:flex;align-items:center;gap:8px}
.h1 .logo{width:44px;height:44px;animation:float 3.5s ease-in-out infinite}
.h1 .nm{font-weight:800;font-size:16px;letter-spacing:.04em;line-height:1.05;white-space:nowrap}
.h1 .nm b{color:var(--amber-d)}
.h1 .sub{font-size:10.5px;font-weight:700;color:#262626;display:flex;align-items:center;gap:5px;margin-top:2px}
.h1 .sub::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
.h1 .pill .ic{background:#F3F3F3}
.h1 .bar{display:flex;gap:8px;margin-top:9px}
.h1 .search{background:#fff;color:var(--muted)}
.h1 .menu{background:#fff;width:46px;height:46px}

/* 2 All black, amber ring */
.h2{background:var(--black);color:#fff;padding:12px 12px 14px;border-radius:0 0 26px 26px}
.h2 .ringer{position:relative;width:52px;height:52px;display:grid;place-items:center;flex:none}
.h2 .ringer::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--amber);border-right-color:var(--amber);animation:spin 4s linear infinite}
.h2 .logo{width:42px;height:42px}
.h2 .nm{font-weight:900;font-size:17px;letter-spacing:.1em;line-height:1.05;white-space:nowrap}
.h2 .nm b{color:var(--amber)}
.h2 .sub{font-size:11px;font-weight:600;color:#BDBDBD;margin-top:3px}
.h2 .ic{background:var(--soft);color:#fff}
.h2 .bar{display:flex;gap:8px;margin-top:12px}
.h2 .search{background:var(--soft);color:#fff;box-shadow:inset 0 0 0 1px #333}
.h2 .search svg{color:var(--amber)}
.h2 .go{width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--black);display:grid;place-items:center;flex:none;animation:glow 2.4s ease-in-out infinite}

/* 3 Centre crest with an amber line of facts */
.h3{background:var(--black);color:#fff;padding:10px 12px 0}
.h3 .rowc{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}
.h3 .mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.h3 .logo{width:48px;height:48px;box-shadow:0 0 0 2px var(--amber);animation:float 3.5s ease-in-out infinite}
.h3 .nm{font-family:Fraunces,serif;font-weight:700;font-size:19px;letter-spacing:.06em;white-space:nowrap}
.h3 .nm b{color:var(--amber);font-weight:700}
.h3 .ic{color:#fff}
.h3 .search{background:#fff;color:var(--muted);margin-top:10px}
.h3 .search svg{color:var(--black)}
.h3 .strip{overflow:hidden;white-space:nowrap;margin:12px -12px 0;padding:8px 0;background:var(--amber);color:var(--black);font-size:12px;font-weight:800}
.h3 .strip div{display:inline-block;animation:tick 22s linear infinite}
.h3 .strip span{margin:0 16px}
.note{max-width:420px;margin:26px auto 0;padding:0 14px;font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="top">Header ke 3 design, jet black me. Jo pasand aaye uska number batao (1, 2 ya 3). Do ko mila bhi sakte ho.</div>
<div class="wrap" id="wrap"></div>
<p class="note">Teeno me PIN wala button nahi hai. Search me jo sujhav type hota hai wo store ki asli collections ke naam hain. Yeh sirf namoone hain; button kaam nahi karte.</p>
<script>
const LOGO = '/suit-aura-mark-132.webp';
const I = {
  menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg>',
  bag: '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4 4"/></svg>',
};
const letters = (text, from = 0) => text.split('').map((l, i) => `<span style="--i:${i + from}">${l === ' ' ? '&nbsp;' : l}</span>`).join('');
const name = () => `${letters('SUIT AURA ')}<b>${letters('GIRLS', 10)}</b>`;
const typed = '<span class="type" data-type></span>';
const page = '<div class="page"><i></i><i></i></div>';
const facts = ['Secure UPI payment', '7-day returns & exchange', 'Delivery across India', 'Chat with us on WhatsApp'];
const opts = [
  ['White pill', 'Abhi jaisa, bina PIN ke: kaale band par safed gol patti, logo halka tairta hai, naam ke akshar lehrate hain. Neeche menu aur poori chaudai ka search jisme sujhav khud type hota hai.',
    `<div class="h1"><div class="pill"><img class="logo" src="${LOGO}" alt=""><div class="f1"><div class="nm wave">${name()}</div><div class="sub">Delivery across India</div></div><span class="ic">${I.heart}</span><span class="ic">${I.bag}<span class="dot">2</span></span></div><div class="bar"><span class="ic menu">${I.menu}</span><div class="search">${I.search}${typed}</div></div></div>`],
  ['All black', 'Poora header kaala, koi safed patti nahi: logo ke charon taraf amber ring ghoomti hai, naam safed aur "GIRLS" amber me lehrata hai. Search gehra kaala, bagal me dhadakta amber gol button. Sabse premium, badi brand jaisa.',
    `<div class="h2"><div class="row" style="gap:10px"><span class="ringer"><img class="logo" src="${LOGO}" alt=""></span><div class="f1"><div class="nm wave">${name()}</div><div class="sub">Ethnic wear · Delivery across India</div></div><span class="ic">${I.heart}</span><span class="ic">${I.bag}<span class="dot">2</span></span></div><div class="bar"><span class="ic" style="width:46px;height:46px">${I.menu}</span><div class="search">${I.search}${typed}</div><span class="go">${I.search}</span></div></div>`],
  ['Centre crest', 'Logo aur naam beech me (naam sundar serif akshar me), dono taraf menu aur bag. Neeche safed search, aur sabse neeche amber patti jisme aapki chaar asli baatein dheere chalti hain.',
    `<div class="h3"><div class="rowc"><span class="ic">${I.menu}</span><div class="mid"><img class="logo" src="${LOGO}" alt=""><span class="nm wave">${name()}</span></div><span class="ic">${I.bag}<span class="dot">2</span></span></div><div class="search">${I.search}${typed}</div><div class="strip"><div>${[...facts, ...facts].map((f) => `<span>✦ ${f}</span>`).join('')}</div></div></div>`],
];
document.getElementById('wrap').innerHTML = opts.map(([title, text, html], i) => `<section class="opt"><h2><b>${i + 1}</b>${title}</h2><p>${text}</p><div class="frame">${html}${page}</div></section>`).join('');
// The search suggestion types itself, rests, is erased, and the next one follows (the store's own collections)
const words = ['suits', 'co-ord sets', 'anarkali', 'dresses', 'festive wear'];
let w = 0, n = 0, dir = 1;
const tick = () => {
  const word = words[w];
  n += dir;
  document.querySelectorAll('[data-type]').forEach((el) => { el.textContent = `Search “${word.slice(0, n)}`; });
  let wait = dir > 0 ? 90 : 40;
  if (dir > 0 && n === word.length) { dir = -1; wait = 1500; }
  else if (dir < 0 && n === 0) { dir = 1; w = (w + 1) % words.length; wait = 350; }
  setTimeout(tick, wait);
};
tick();
</script>
</body>
</html>
