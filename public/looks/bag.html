<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Your bag: 5 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/looks/looks.css">
<style>
.hd{display:flex;align-items:center;gap:10px;padding:14px 14px 4px}
.item{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px;align-items:center}
.item img{width:78px;aspect-ratio:4/5;border-radius:14px}
.qty{display:inline-flex;align-items:center;gap:2px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);height:36px;padding:0 4px;font-weight:700}
.qty span{width:28px;height:28px;display:grid;place-items:center}
.qty svg{width:15px;height:15px}
.sum{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);margin-top:14px}
/* 2 tickets */
.tk{display:grid;grid-template-columns:70px 1fr auto;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(34,27,51,.07)}
.tk img{width:70px;height:100%;min-height:96px}
.tk .end{border-left:2px dashed var(--line);padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.tk .end::before,.tk .end::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--page)}
.tk .end::before{top:-8px}.tk .end::after{bottom:-8px}
/* 3 big photos */
.big{display:flex;gap:10px;overflow:hidden;padding:0 14px}
.big>div{flex:none;width:62%}
.big img{width:100%;aspect-ratio:4/5;border-radius:20px}
/* 4 steps */
.steps{display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:12px;font-weight:700}
.steps b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px}
.steps .on b{background:var(--brand);color:#fff}.steps .on{color:var(--ink)}.steps span{color:var(--muted);display:flex;align-items:center;gap:5px}
.steps i{flex:1;height:2px;background:var(--line)}
.rowi{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rowi img{width:56px;aspect-ratio:4/5;border-radius:12px}
/* 5 receipt */
.rcpt{background:#fff;margin:0 14px;padding:16px 16px 22px;box-shadow:0 2px 10px rgba(34,27,51,.07);border-radius:16px 16px 0 0;-webkit-mask:radial-gradient(circle 7px at 7px 100%,transparent 98%,#000) 0 0/14px 100%;mask:radial-gradient(circle 7px at 7px 100%,transparent 98%,#000) 0 0/14px 100%}
.dash{border-top:2px dashed var(--line);margin:8px 0}
</style>
</head>
<body>
<script src="/looks/kit.js"></script>
<script>
const A = { ...P1, size: 'M', colour: 'Sky Blue', photo: P1.photos[0] };
const B = P2;
const qty = `<span class="qty">${`<span>${I.minus}</span>`}<span class="num">1</span><span>${I.plus}</span></span>`;
const meta = (x) => `<div class="t12 muted mt4">Size ${x.size} · ${x.colour}</div>`;
const pr = (x) => `<span class="num"><span class="xb t16">${rs(x.price)}</span> <span class="strike t12">${rs(x.mrp)}</span></span>`;
const head = (t = 'Your bag') => `<div class="hd"><span class="ic bg-sunken">${I.left}</span><div class="serif t22">${t} <span class="t13 muted" style="font-family:Figtree;font-weight:600">2 items</span></div></div>`;
const totals = (dark = false) => `<div class="sum"><span>Item total</span><span class="num">${rs(BAG.items)}</span></div><div class="sum"><span>Coupon AURA10</span><span class="num ${dark ? '' : 'salec'} b">− ${rs(BAG.coupon)}</span></div><div class="sum"><span>Delivery</span><span class="${dark ? '' : 'salec'} b">Free</span></div>`;
const coupon = `<div class="row g8 p12 bg-mint" style="border-radius:16px;color:var(--mint-ink)"><span class="ic" style="background:#fff;width:34px;height:34px">${I.check}</span><div class="f1"><div class="xb t13">AURA10 applied</div><div class="t12">You save ${rs(BAG.coupon)} with this code</div></div><span class="b t12" style="text-decoration:underline">Remove</span></div>`;
const online = `<div class="t12 muted mt8">Extra 5% off when you pay online is added on the pay step.</div>`;

render('Your bag', [
  ['Cards', 'Abhi jaisa, naye rang me: har cheez safed card me photo, size, ginti aur daam ke saath. Coupon ki hari patti, hisaab ka card, neeche chipki patti me kul rakam aur Checkout.',
    `${head()}<div class="col g10 px14 mt8">${[A, B].map((x) => `<div class="card item"><img src="${img(x.photo, 240)}" alt=""><div><div class="b t13 clamp2">${x.name}</div>${meta(x)}<div class="row between mt8">${qty}${pr(x)}</div></div></div>`).join('')}
     ${coupon}<div class="card p14"><div class="b t15">Price details</div><div class="mt6">${totals()}</div><div class="hr mt6"></div><div class="sum xb t16 mt6"><span>To pay</span><span class="num">${rs(BAG.total)}</span></div>${online}</div></div>
     <div class="bar"><div class="none num"><div class="xb t18">${rs(BAG.total)}</div><div class="t11 salec b">You save ${rs(BAG.saved)}</div></div><span class="pill btn primary f1">Checkout ${I.chev}</span></div>`],
  ['Tickets', 'Sabse upar hari patti: "is order par itni bachat". Har cheez ek ticket jaisi, kati hui lakeer ke paar daam aur ginti. Neeche dark block me kul rakam aur button, deal ke ticket se mel khata hai.',
    `${head()}<div class="px14 mt8"><div class="row g8 p12 bg-mint blk" style="color:var(--mint-ink)"><span class="sticker none" style="width:44px;height:44px;font-size:10px;animation:none"><span>SAVE</span></span><div class="xb t15">You save ${rs(BAG.saved)} on this order</div></div>
     <div class="col g10 mt10">${[A, B].map((x) => `<div class="tk"><img src="${img(x.photo, 240)}" alt=""><div style="padding:10px;min-width:0"><div class="b t13 clamp2">${x.name}</div>${meta(x)}<div class="t12 salec xb mt4">${x.off}% off</div></div><div class="end"><span class="xb t16 num">${rs(x.price)}</span>${qty}</div></div>`).join('')}</div>
     <div class="row g8 mt10"><div class="field f1" style="border-radius:99px;height:46px">Coupon code</div><span class="pill btn-sm dark" style="height:46px">Apply</span></div>
     <div class="row g6 mt8"><span class="pill btn-sm bg-butter" style="height:32px;color:var(--butter-ink)">${I.tag.replace('<svg', '<svg style="width:15px;height:15px"')}AURA10 · 10% off above ₹999</span></div></div>
     <div class="bg-ink p16 mt16" style="border-radius:28px 28px 0 0">${totals(true)}<div class="hr mt6" style="background:#3A3350"></div><div class="row between mt10"><div><div class="t12" style="color:#B9B3CC">To pay</div><div class="xb t22 num">${rs(BAG.total)}</div></div><span class="pill btn" style="background:var(--hl);color:var(--ink)">Checkout ${I.chev}</span></div></div>`],
  ['Big photos', 'Kapde bade dikhte hain: har cheez ki badi photo, ungli se khiskao. Neeche chhota saaf hisaab. Jo log photo dekh ke kharidte hain unke liye.',
    `${head()}<div class="big mt8">${[A, B].map((x) => `<div><img src="${img(x.photo)}" alt=""><div class="b t13 clamp2 mt8">${x.name}</div>${meta(x)}<div class="row between mt8">${pr(x)}${qty}</div></div>`).join('')}</div>
     <div class="px14 mt16"><div class="bg-lilac blk p14">${totals()}<div class="sum xb t18 mt6" style="border-top:1.5px solid #CFC3F7;padding-top:10px"><span>To pay</span><span class="num">${rs(BAG.total)}</span></div></div>
     <span class="pill btn primary mt12" style="width:100%">Checkout · ${rs(BAG.total)}</span><div class="row center g6 t12 muted mt10" style="padding-bottom:14px">${I.lock.replace('<svg', '<svg style="width:15px;height:15px"')}Secure UPI payment · 7-day returns & exchange</div></div>`],
  ['Steps', 'Upar teen kadam dikhte hain: Bag → Address → Pay, taaki customer ko pata rahe kitna bacha hai. Neeche patli saaf list, kam jagah me zyada cheezein.',
    `${miniHeader()}<div class="steps"><span class="on"><b>1</b>Bag</span><i></i><span><b>2</b>Address</span><i></i><span><b>3</b>Pay</span></div>
     ${[A, B].map((x) => `<div class="rowi"><img src="${img(x.photo, 160)}" alt=""><div style="min-width:0"><div class="b t13 clamp2">${x.name}</div>${meta(x)}<div class="t12 brand b mt4" style="text-decoration:underline">Remove</div></div><div style="text-align:right"><div class="xb t15 num">${rs(x.price)}</div><div class="mt6">${qty}</div></div></div>`).join('')}
     <div class="px14" style="border-top:1px solid var(--line);padding-top:12px">${coupon}<div class="mt10">${totals()}</div><div class="sum xb t16" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span>To pay</span><span class="num">${rs(BAG.total)}</span></div></div>
     <div class="bar"><span class="pill btn primary f1">Continue to address ${I.chev}</span></div>`],
  ['Receipt', 'Hisaab ek kagaz ki raseed jaisa, neeche kati hui kinari. Customer ko dukaan ke bill jaisa bharosa lagta hai. Upar chhoti cheezon ki list, neeche bada button.',
    `${head()}<div class="col g8 px14 mt8">${[A, B].map((x) => `<div class="row g10"><img src="${img(x.photo, 160)}" alt="" style="width:54px;aspect-ratio:4/5;border-radius:12px"><div class="f1"><div class="b t13 clamp2">${x.name}</div>${meta(x)}</div>${qty}</div>`).join('')}</div>
     <div class="rcpt mt16"><div class="serif t16" style="text-align:center">Suit Aura Girls</div><div class="t11 muted" style="text-align:center">Your order</div><div class="dash"></div>
     ${[A, B].map((x) => `<div class="sum t13"><span class="f1" style="padding-right:10px">${x.short} × 1</span><span class="num b">${rs(x.price)}</span></div>`).join('')}<div class="dash"></div>${totals()}<div class="dash"></div><div class="sum xb t18"><span>To pay</span><span class="num">${rs(BAG.total)}</span></div><div class="t12 salec b" style="text-align:center;margin-top:6px">You save ${rs(BAG.saved)} on this order</div></div>
     <div class="px14 mt16" style="padding-bottom:14px"><span class="pill btn primary" style="width:100%">Checkout ${I.chev}</span></div>`],
]);
</script>
</body>
</html>
