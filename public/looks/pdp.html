<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Product page: 5 options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/looks/looks.css">
<style>
.strip{display:flex;gap:8px;overflow:hidden;padding:10px 14px 0}
.strip img{flex:none;width:84%;aspect-ratio:4/5;border-radius:18px;background:var(--sunken)}
.thumbs{display:flex;gap:8px;padding:8px 14px 0;overflow:hidden}
.thumbs img{flex:none;width:52px;aspect-ratio:4/5;border-radius:12px;box-shadow:0 0 0 2px transparent}
.thumbs img.on{box-shadow:0 0 0 2px var(--ink)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);margin-top:14px}
.offer{display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 12px;font-size:13px;font-weight:700}
/* 2 arch */
.arch{background:var(--peach);padding:16px 14px 44px;position:relative;text-align:center}
.arch .ph{width:74%;margin:0 auto;aspect-ratio:4/5;border-radius:160px 160px 20px 20px;overflow:hidden;background:#fff}
.arch .ph img{width:100%;height:100%}
.arch .sticker{position:absolute;left:8%;bottom:54px;width:66px;height:66px;font-size:12px}
.sheet{background:#fff;border-radius:28px 28px 0 0;margin-top:-26px;position:relative;padding:16px 14px 16px;box-shadow:0 -6px 18px rgba(34,27,51,.07)}
.dots{display:flex;gap:10px;justify-content:center}
.dots img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.5px transparent}
.dots img.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--brand)}
/* 3 cards */
.hero3 img{width:100%;aspect-ratio:4/4.6;border-radius:0 0 28px 28px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.tiles>div{border-radius:20px;padding:12px}
.tiles .wide{grid-column:1/-1}
.float{margin:14px 12px 12px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px}
/* 4 story */
.bars{display:flex;gap:4px;padding:10px 14px 8px}
.bars i{flex:1;height:3.5px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--ink)}
.story img{width:100%;aspect-ratio:4/5}
/* 5 side */
.side{display:grid;grid-template-columns:54% 1fr;gap:12px;padding:12px 14px 0}
.side img{width:100%;aspect-ratio:4/5;border-radius:18px}
.sel{height:44px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--control);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600;background:#fff}
.patti{margin:14px;border-radius:20px;background:var(--ink);color:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px;text-align:center;font-size:10.5px;font-weight:700;line-height:1.25}
.patti i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--hl);color:var(--ink);margin:0 auto 6px}
.patti svg{width:17px;height:17px}
.acc{display:flex;align-items:center;justify-content:space-between;padding:14px;border-top:1px solid var(--line);font-weight:700}
</style>
</head>
<body>
<script src="/looks/kit.js"></script>
<script>
const p = P1;
const ph = (i, w = 480) => img(p.photos[i], w);
const title = (size = 16) => `<div class="b" style="font-size:${size}px;line-height:1.3">${p.name}</div>`;
const rating = `<div class="row g6 mt6 t13">${stars()}<span class="b">${p.rating}</span><span class="muted">· ${p.reviews} reviews</span></div>`;
const sizes = (on = 2, n = 6) => `<div class="row g6 wrapx">${p.sizes.slice(0, n).map((s, i) => `<span class="chip${i === on ? ' on' : ''}">${s}</span>`).join('')}</div>`;
const thumbs = `<div class="thumbs">${p.photos.map((_, i) => `<img class="${i ? '' : 'on'}" src="${ph(i, 160)}" alt="">`).join('')}</div>`;
const online = `<div class="offer bg-butter" style="color:var(--butter-ink)">${I.tag}Extra 5% off when you pay online</div>`;

render('Product page', [
  ['Gallery', 'Abhi jaisa, naye rang me: badi photo, neeche chhoti photo ki patti, daam, offer ki patti, size ke gol chip. Neeche chipki patti me Add to bag aur peela Buy now.',
    `${miniHeader()}<div class="strip"><img src="${ph(0)}" alt=""><img src="${ph(1, 240)}" alt=""></div>${thumbs}
     <div class="px14 mt12"><div class="row between g8"><div class="f1">${title()}</div><span class="ic bg-sunken">${I.heart}</span></div>${rating}<div class="mt10">${priceLine(p, 26)}</div><div class="t12 salec b mt4">You save ${rs(p.mrp - p.price)} · Inclusive of all taxes</div>
     <div class="mt12">${online}</div><div class="row between mt14"><span class="b">Size: M</span><span class="brand b t13" style="text-decoration:underline">Size guide</span></div><div class="mt8">${sizes()}</div></div>
     <div class="bar"><div class="none num"><div class="xb t16">${rs(p.price)}</div><div class="t11 salec b">${p.off}% off</div></div><span class="pill btn outline f1">Add to bag</span><span class="pill btn buy f1">Buy now</span></div>`],
  ['Arch', 'Peach block par photo mehraab (arch) me, bagal me gol "% off" sticker. Colour gol tasveeron se chunte hain. Neeche se safed sheet uthti hai jisme naam, daam, size aur dono button.',
    `${miniHeader()}<div class="arch"><div class="ph"><img src="${ph(0)}" alt=""></div><span class="sticker"><span><span class="t16">${p.off}%</span><br>off</span></span></div>
     <div class="sheet"><div class="dots">${p.photos.map((_, i) => `<img class="${i ? '' : 'on'}" src="${ph(i, 160)}" alt="">`).join('')}</div><div class="t12 muted b mt8" style="text-align:center">Colour: Sky Blue</div>
     <div class="mt12 serif t20" style="line-height:1.2">${p.short}</div>${rating}<div class="mt10">${priceLine(p, 26)}</div>
     <div class="b mt14">Choose your size</div><div class="mt8">${sizes()}</div>
     <div class="col g8 mt16"><span class="pill btn buy">Buy now · ${rs(p.price)}</span><span class="pill btn outline">${I.bag}Add to bag</span></div>
     <div class="row center g6 t12 muted mt12">${I.lock.replace('<svg', '<svg style="width:15px;height:15px"')}Secure UPI payment · 7-day returns & exchange</div></div>`],
  ['Pastel cards', 'Photo poori chaudai me, neeche gol kone. Phir har baat apne rang ke card me: daam (mint), size (lilac), delivery ka PIN check (sky), offers (butter). Neeche tairta dark "Buy now" pill.',
    `<div class="hero3"><img src="${ph(0, 640)}" alt=""></div><div class="px14 mt12">${title(17)}${rating}</div>
     <div class="tiles mt12"><div class="bg-mint"><div class="t11 xb" style="color:var(--mint-ink)">PRICE</div><div class="xb t22 num mt4">${rs(p.price)}</div><div class="t12 num"><span class="strike">${rs(p.mrp)}</span> <span class="salec xb">${p.off}% off</span></div></div>
     <div class="bg-butter"><div class="t11 xb" style="color:var(--butter-ink)">OFFERS</div><div class="b t13 mt4">5% off on online payment</div><div class="t12 mt4">Code <b>AURA10</b>: 10% off above ₹999</div></div>
     <div class="bg-lilac wide"><div class="row between"><span class="t11 xb" style="color:var(--lilac-ink)">SIZE</span><span class="brand b t12" style="text-decoration:underline">Size guide</span></div><div class="mt8">${sizes(2, 8)}</div></div>
     <div class="bg-sky wide"><div class="t11 xb" style="color:var(--sky-ink)">DELIVERY</div><div class="row g8 mt8"><div class="field f1" style="height:44px;border-radius:99px;box-shadow:none">Enter PIN code</div><span class="pill btn-sm dark">Check</span></div><div class="t12 mt8" style="color:var(--sky-ink)">We deliver across India · 7-day returns & exchange</div></div></div>
     <div class="float"><div class="f1 num"><div class="xb t16">${rs(p.price)}</div><div class="t11" style="color:var(--hl)">${p.off}% off</div></div><span class="ic" style="background:#34313F">${I.heart}</span><span class="pill btn-sm" style="background:#fff;color:var(--ink)">Add</span><span class="pill btn-sm buy">Buy now</span></div>`],
  ['Story', 'Instagram story jaisa: photo ke upar patli lakeeren batati hain kaun si photo chal rahi hai, photo poori screen jitni chaudi. Ad se aane walon ko jana-pehchana lagega. Neeche colour ka naam aur chhoti jankari.',
    `<div class="bars">${p.photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><div class="story"><img src="${ph(0, 640)}" alt=""></div>
     <div class="px14 mt10"><div class="row between"><span class="pill btn-sm bg-lilac" style="height:30px;color:var(--lilac-ink)">Colour: Sky Blue · 1 / 5</span><div class="row g6"><span class="ic bg-sunken">${I.heart}</span><span class="ic bg-sunken">${I.share}</span></div></div>
     <div class="mt10">${title(17)}</div><div class="row between mt8">${priceLine(p, 24)}<span class="rate">${p.rating} ★</span></div>
     <div class="b mt14">Size</div><div class="mt8">${sizes()}</div><div class="mt12">${online}</div></div>
     <div class="bar"><span class="pill btn outline f1">${I.bag}Add to bag</span><span class="pill btn buy f1">Buy now</span></div>`],
  ['Side by side', 'Photo baayein, jankari daayein ek hi nazar me: naam, rating, daam, size ki list. Neeche dono bade button, phir dark patti me chaar bharose ki baatein aur khulne wali jankari.',
    `${miniHeader()}<div class="side"><img src="${ph(0)}" alt=""><div class="col g8"><span class="badge bg-ink white" style="align-self:flex-start">NEW</span><div class="b t15 clamp2" style="-webkit-line-clamp:4;line-height:1.25">${p.short}</div><span class="rate" style="align-self:flex-start">${p.rating} ★ <span style="font-weight:600">(${p.reviews})</span></span><div class="num"><div class="xb t22">${rs(p.price)}</div><div class="t12"><span class="strike">${rs(p.mrp)}</span> <span class="salec xb">${p.off}% off</span></div></div><div class="sel t13">Size: M ${I.down}</div><div class="sel t13">Sky Blue ${I.down}</div></div></div>${thumbs}
     <div class="col g8 px14 mt14"><span class="pill btn buy">Buy now</span><span class="pill btn outline">${I.bag}Add to bag</span></div>
     <div class="patti">${FACTS.map(([k, t]) => `<div><i>${I[k]}</i>${t}</div>`).join('')}</div>
     <div class="acc">Product details ${I.down}</div><div class="acc">Size guide ${I.down}</div><div class="acc">Reviews (${p.reviews}) ${I.down}</div>`],
]);
</script>
</body>
</html>
