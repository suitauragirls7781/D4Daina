    <!-- Immediate Mobile Browser Polyfill & Crash Shield (Vivo, iQOO, Mi, Samsung, WebView, Private Browsing) -->
    <script>
      (function() {
        var memoryStorage = {};
        
        // Safe localStorage polyfill
        try {
          var testKey = '__sba_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (e) {
          try {
            Object.defineProperty(window, 'localStorage', {
              value: {
                getItem: function(k) { return memoryStorage[k] || null; },
                setItem: function(k, v) { memoryStorage[k] = String(v); },
                removeItem: function(k) { delete memoryStorage[k]; },
                clear: function() { memoryStorage = {}; },
                key: function(i) { return Object.keys(memoryStorage)[i] || null; },
                get length() { return Object.keys(memoryStorage).length; }
              },
              writable: true,
              configurable: true
            });
          } catch (err) {}
        }

        // Safe sessionStorage polyfill
        try {
          var testKeyS = '__sba_test_s__';
          window.sessionStorage.setItem(testKeyS, '1');
          window.sessionStorage.removeItem(testKeyS);
        } catch (e) {
          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: {
                getItem: function(k) { return memoryStorage['s_' + k] || null; },
                setItem: function(k, v) { memoryStorage['s_' + k] = String(v); },
                removeItem: function(k) { delete memoryStorage['s_' + k]; },
                clear: function() { },
                key: function(i) { return null; },
                get length() { return 0; }
              },
              writable: true,
              configurable: true
            });
          } catch (err) {}
        }

        // Safe Storage prototype patch
        if (typeof Storage !== 'undefined' && Storage.prototype) {
          try {
            var origSet = Storage.prototype.setItem;
            var origGet = Storage.prototype.getItem;
            var origRemove = Storage.prototype.removeItem;
            Storage.prototype.setItem = function(k, v) { try { origSet.call(this, k, v); } catch (e) { memoryStorage[k] = String(v); } };
            Storage.prototype.getItem = function(k) { try { return origGet.call(this, k); } catch (e) { return memoryStorage[k] || null; } };
            Storage.prototype.removeItem = function(k) { try { origRemove.call(this, k); } catch (e) { delete memoryStorage[k]; } };
          } catch (e) {}
        }

        // Safe matchMedia
        if (!window.matchMedia) {
          window.matchMedia = function(q) {
            return {
              matches: false, media: q, onchange: null,
              addListener: function() {}, removeListener: function() {},
              addEventListener: function() {}, removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          };
        }

        // Safe ResizeObserver
        if (!window.ResizeObserver) {
          window.ResizeObserver = function() {
            this.observe = function() {};
            this.unobserve = function() {};
            this.disconnect = function() {};
          };
        }

        // Safe IntersectionObserver
        if (!window.IntersectionObserver) {
          window.IntersectionObserver = function() {
            this.observe = function() {};
            this.unobserve = function() {};
            this.disconnect = function() {};
          };
        }

        // Safe crypto.randomUUID
        if (!window.crypto) { window.crypto = {}; }
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function() {
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
              return (c ^ (Math.random() * 16 >> (c / 4))).toString(16);
            });
          };
        }

      })();
    </script>

    <!-- The catalogue is asked for before the app's code arrives (src/lib/catalog.ts picks this answer up). Shop pages
         only. The product photo is NOT preloaded here: measured on a phone connection it took bandwidth from the
         app's code and the name and price came half a second later. -->
    <script>
      (function () {
        try {
          var path = location.pathname;
          if (!/^\/($|product\/|shop|category\/|checkout|cart|wishlist)/.test(path)) return;
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || localStorage.getItem('sag_admin_live') === '1') return;
          var asked = fetch('/api/admin-config?action=catalog&v=' + Math.floor(Date.now() / 300000))
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
          window.__sagCatalog = asked;
        } catch (e) {}
      })();
    </script>
