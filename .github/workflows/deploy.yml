# Deploys the store to Cloudflare on every push to main, from GitHub's own machines.
# This is the second road to live: Cloudflare's "Workers Builds" also deploys on push, but it has failed to
# start at times. Either one finishing is enough (they deploy the same code), and the last step checks the site.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers" + D1 Edit).
# Until that secret exists the deploy step is skipped and the run stays green.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 65142a242e92f18ec9db9798f3ac35b4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the run before anything is uploaded if the code does not type-check or build
      - run: npx tsc --noEmit
      - run: npm run build:cf
      - name: Deploy (skipped until the CLOUDFLARE_API_TOKEN secret is added)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for attempt in 1 2 3; do
            npx wrangler@4 deploy && exit 0
            echo "Deploy attempt $attempt failed; trying again in 30 seconds"
            sleep 30
          done
          exit 1
      - name: Check the live site answers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          curl -fsS -o /dev/null https://www.suitauragirls.in/
          curl -fsS "https://www.suitauragirls.in/api/admin-config?action=catalog&v=ci${GITHUB_RUN_ID}" | grep -q '"products"'
